name = "siechnice-wp-shim"
main = "index.js"
compatibility_date = "2025-06-01"

# Worker łapie tylko API WordPressa. Strona główna NIE idzie przez Workera (limit żądań, ryzyko awarii) —
# znacznik wykrywania API (<link rel="https://api.w.org/">) dokłada szablon Bolta w <head>.
routes = [
  { pattern = "siechnice.com.pl/wp-json*", zone_name = "siechnice.com.pl" },
  # Jeśli serwis odpowiada też pod www, odkomentuj:
  # { pattern = "www.siechnice.com.pl/wp-json*", zone_name = "siechnice.com.pl" },
]

# Utwórz KV "SHIM" w panelu (Storage & Databases → KV), skopiuj jego ID i wklej poniżej.
kv_namespaces = [
  { binding = "SHIM", id = "7acc8c328c1f4e889020e554e8fdf17e" },
]

[vars]
SITE_URL = "https://siechnice.com.pl"
SITE_TITLE = "Siechnice.com.pl"
WP_USER = "linkhouse"
# Adres artykułu w Bolcie; {slug} i {id} są podmieniane.
POST_URL_TEMPLATE = "https://siechnice.com.pl/news/{slug}"
# "false" = etap rozpoznania: wpis zapisany, publikacja odrzucona (503).
ACCEPT_PUBLISH = "false"
# "all" = loguj wszystko, "auth" = tylko żądania z loginem (mniej śmieci od botów)
LOG_MODE = "all"
# Kategorie pokazywane platformom (id muszą być liczbami).
CATEGORIES = '[{"id":1,"name":"Aktualności","slug":"aktualnosci"},{"id":2,"name":"Artykuły sponsorowane","slug":"artykuly-sponsorowane"}]'

# UWAGA: przy każdym wdrożeniu z GitHuba te [vars] nadpisują zmienne z panelu,
# więc zmieniaj je tutaj, w repozytorium.
# Sekrety ustaw w panelu (Settings → Variables and Secrets → typ Secret),
# deploy ich nie rusza: WP_APP_PASSWORD, ADMIN_TOKEN
